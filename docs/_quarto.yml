website:
  title: "fmrimod"
  description: "fMRI design and statistical modeling in Python."
  site-url: "https://bbuchsbaum.github.io/fmrimod/"
  repo-url: "https://github.com/bbuchsbaum/fmrimod"
  repo-subdir: docs
  repo-actions: [edit, issue]
  repo-branch: main
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  reader-mode: false
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    pinned: true
    logo: ""
    # No background:/foreground: — let the SCSS drive the navbar palette.
    left:
      - text: "Get started"
        href: get-started.qmd
      - text: "Tutorials"
        href: tutorials/index.qmd
      - text: "Inspect models"
        href: tutorials/plotting-visualization.qmd
      - text: "Concepts"
        href: concepts/mental-model.qmd
      - text: "API"
        href: reference/index.qmd
      - text: "Evidence"
        href: evidence/index.qmd
      - text: "Help"
        href: help/troubleshooting.qmd
    right:
      - icon: github
        href: "https://github.com/bbuchsbaum/fmrimod"
        aria-label: GitHub
  sidebar:
    - id: tutorials
      title: "Tutorials"
      style: floating
      align: left
      contents:
        - tutorials/index.qmd
        - section: "Learn the workflow"
          contents:
            - tutorials/golden-path.qmd
            - tutorials/real-data-fiac.qmd
            - tutorials/overview-workflow.qmd
            - tutorials/datasets.qmd
            - tutorials/design-matrices.qmd
            - tutorials/linear-model.qmd
            - tutorials/contrasts.qmd
            - tutorials/group-analysis.qmd
        - section: "Extend the model"
          contents:
            - tutorials/parametric-modulators.qmd
            - tutorials/single-trial.qmd
            - tutorials/estimating-hrfs.qmd
            - tutorials/sketched-ar-models.qmd
            - tutorials/robust-models.qmd
            - tutorials/functional-connectivity.qmd
        - section: "Inspect and integrate"
          contents:
            - tutorials/plotting-visualization.qmd
            - tutorials/group-diagnostics.qmd
            - tutorials/plot-gallery.qmd
            - tutorials/simulation.qmd
            - tutorials/bids-io.qmd
            - tutorials/benchmark-datasets.qmd
            - tutorials/plugin-development.qmd
            - tutorials/module-coverage.qmd
  page-footer:
    border: false
    left: "© 2026 Bradley Buchsbaum"
    right:
      - icon: github
        href: "https://github.com/bbuchsbaum/fmrimod"

format:
  html:
    # Shared editorial layout; night overrides only the palette.
    theme:
      light: [_theme-base.scss]
      dark: [_theme-base.scss, _theme-night.scss]
    css: styles.css
    include-before-body: _includes/skip-link.html
    include-after-body: _includes/figure-navigation.html
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "On this page"
    number-sections: false
    anchor-sections: true
    code-copy: true
    code-fold: true
    code-summary: "Show Python"
    code-overflow: wrap
    code-link: true
    code-annotations: hover
    # A light/dark map here makes Quarto 1.7 emit no highlighting CSS at all;
    # the single name gets its own dark variant.
    highlight-style: github
    lightbox: true
    fig-align: left
    fig-cap-location: bottom
    fig-format: svg
    fig-dpi: 200
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true
    grid:
      sidebar-width: 245px
      body-width: 790px
      margin-width: 220px
      gutter-width: 1.5rem

execute:
  freeze: auto
  cache: true
  warning: false
  message: false

# Single source of truth for the quartodoc config. Do NOT also declare a
# `quartodoc:` block here — a duplicate shadows the file.
metadata-files:
  - _quartodoc.yml
  - reference/_sidebar.yml
